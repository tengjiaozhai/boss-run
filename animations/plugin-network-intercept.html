let step = -1        // -1 = 未开始（初始静帧）
let phase = -1
let runToken = 0
let playing = false
let autoTimer = 0

let lastCaptionStep = null
function renderCaption () {
  if (step === lastCaptionStep && caption.children.length) return
  lastCaptionStep = step
  const s = STEPS[step]
  caption.innerHTML = ''
  if (!s) return
  const h = document.createElement('h3')
  const no = document.createElement('span')
  no.className = 'step-no'
  no.textContent = `${step + 1}/${STEPS.length}`
  h.append(no, document.createTextNode(s.title))
  const p = document.createElement('p')
  p.textContent = s.body
  const src = document.createElement('p')
  src.className = 'src'
  const code = document.createElement('code')
  code.textContent = s.src
  src.appendChild(code)
  caption.append(h, p, src)
}

function renderControls () {
  btnPrev.disabled = step <= 0
  btnNext.disabled = step >= STEPS.length - 1
  btnPlay.textContent = playing ? '暂停' : (step === STEPS.length - 1 ? '重播' : '播放')
  ;[...dots.children].forEach((d, i) => d.setAttribute('aria-current', String(i === step)))
}

function applyState () {
  stage.dataset.step = step < 0 ? '0' : String(step + 1)
  stage.dataset.phase = ['a', 'b', 'c', 'd'][phase] ?? ''
  if (step < 0) { stage.dataset.phase = '' }
  renderCaption()
  renderControls()
}

/* 步内推进：按 STEPS[step].phases 依次切换 phase；停拍时保持最后一个已定义相位 */
async function runStep (token) {
  const s = STEPS[step]
  for (let p = 0; p < s.phases.length; p++) {
    if (token !== runToken) return
    phase = p
    applyState()
    await new Promise(r => setTimeout(r, s.phases[p]))
  }
  if (token !== runToken) return
  phase = s.phases.length - 1
  applyState()
  if (playing && step < STEPS.length - 1) {
    autoTimer = setTimeout(() => { if (token === runToken && playing) goto(step + 1) }, s.hold)
  } else if (playing && step === STEPS.length - 1) {
    playing = false
    renderControls()
  }
}

function goto (n) {
  clearTimeout(autoTimer)
  runToken++
  const token = runToken
  step = Math.max(0, Math.min(n, STEPS.length - 1))
  phase = -1
  applyState()
  runStep(token)
}

function togglePlay () {
  if (playing) {
    playing = false
    clearTimeout(autoTimer)
    renderControls()
    return
  }
  playing = true
  renderControls()
  if (step === STEPS.length - 1) { goto(0); return }
  const s = STEPS[step]
  autoTimer = setTimeout(() => goto(step + 1), Math.min(s.hold, 1200))
}

STEPS.forEach((s, i) => {
  const b = document.createElement('button')
  b.type = 'button'
  b.textContent = s.name
  b.addEventListener('click', () => goto(i, false))
  dots.appendChild(b)
})
btnPrev.addEventListener('click', () => goto(step - 1))
btnNext.addEventListener('click', () => goto(step + 1))
btnPlay.addEventListener('click', togglePlay)
document.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLButtonElement) return
  if (e.key === 'ArrowRight') goto(step + 1)
  else if (e.key === 'ArrowLeft') goto(step - 1)
  else if (e.key === ' ') { e.preventDefault(); togglePlay() }
})

/* 初始静帧：舞台完整可见，解说引导开始 */
stage.dataset.step = '0'
stage.dataset.phase = ''
renderControls()
caption.innerHTML = '<h3><span class="step-no">0/6</span>舞台就绪</h3><p>六拍动画：装配耳朵 → 像人点击 → 网站自发请求 → 网络层截胡 → 原件继续渲染 → 互不知晓。按「播放」开始，或用 ←/→ 逐步细看。</p>'
</script>
